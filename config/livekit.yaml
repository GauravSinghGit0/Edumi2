# ==============================================================================
# LiveKit SFU Server Configuration — TEMPLATE ONLY
# ==============================================================================
# ⚠️  DO NOT USE THIS FILE DIRECTLY ON THE SERVER.
#
# This file is a reference template committed to git.
# The actual runtime config is GENERATED by deploy.sh at:
#   APP_DIR/config/livekit.yaml
#
# deploy.sh will:
#   1. Detect the server's real LAN IP and set node_ip automatically
#   2. Generate a secure random API key + secret
#   3. Write both to .env (LIVEKIT_API_KEY / LIVEKIT_API_SECRET)
#      AND to this config file — so they always match
#
# To generate manually (bare-metal, no deploy.sh):
#   LK_KEY="lk_$(openssl rand -hex 8)"
#   LK_SECRET="$(openssl rand -hex 24)"
#   LAN_IP=$(ip route get 8.8.8.8 | awk '{print $7; exit}')
#   Then replace the placeholders below and set the same values in .env
# ==============================================================================

port: 7880
bind_addresses:
  - ""                        # bind to all interfaces

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: false
  node_ip: "YOUR_SERVER_LAN_IP"   # ← set to your server's real LAN IP (e.g. 192.168.1.10)
  stun_servers:
    - stun.l.google.com:19302
    - stun1.l.google.com:19302

# ⚠️  Key must match LIVEKIT_API_KEY + LIVEKIT_API_SECRET in .env exactly
keys:
  YOUR_LIVEKIT_API_KEY: YOUR_LIVEKIT_API_SECRET

room:
  empty_timeout: 300          # delete empty rooms after 5 min
  max_participants: 100

logging:
  level: warn

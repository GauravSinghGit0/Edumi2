# ==============================================================================
# LiveKit SFU Server Configuration (Windows)
# Key must match LIVEKIT_API_KEY + LIVEKIT_API_SECRET in .env exactly
# ==============================================================================
port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  node_ip: "172.20.30.35"
  stun_servers:
    - stun.l.google.com:19302
    - stun1.l.google.com:19302

keys:
  devkey: devsecret_must_be_32_characters_long_1234
  edumi_livekit_key_2026: edumi_livekit_sec_32chars_key_2026_prod

room:
  empty_timeout: 300
  max_participants: 100

logging:
  level: info

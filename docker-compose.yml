# ==============================================================================
# EduMi — Production Docker Compose Orchestration (Compose V2)
# Multi-container stack: PostgreSQL, Redis, LiveKit SFU, Daphne ASGI,
# Streaming Microservice, Celery Worker, and Nginx Reverse Proxy.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database — Relational persistence with automated healthcheck
  # ----------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: edumi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edumi_db}
      POSTGRES_USER: ${POSTGRES_USER:-edumi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edumi_user} -d ${POSTGRES_DB:-edumi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - edumi_net

  # ----------------------------------------------------------------------------
  # 2. Redis Cache & Broker — Channel Layers & Celery Task Queue
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: edumi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - edumi_net

  # ----------------------------------------------------------------------------
  # 3. LiveKit WebRTC SFU — Low-latency audio/video packet router
  # ----------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:latest
    container_name: edumi_livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50200:50000-50200/udp"
    environment:
      LIVEKIT_PORT: "7880"
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    command: ["--config", "/etc/livekit.yaml"]
    networks:
      - edumi_net

  # ----------------------------------------------------------------------------
  # 4. Primary Web Application — Daphne ASGI Server (HTTP & WebSockets)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      args:
        SECRET_KEY: ${SECRET_KEY}
        DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-edumi_core.settings}
    container_name: edumi_web
    restart: unless-stopped
    command: ["daphne", "-b", "0.0.0.0", "-p", "8002", "edumi_core.asgi:application"]
    env_file: .env
    volumes:
      - ./database/media:/app/database/media
      - ./media:/app/media
      - staticfiles_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8002:8002"
    networks:
      - edumi_net

  # ----------------------------------------------------------------------------
  # 5. Streaming Microservice — Dedicated RTSP ingestion & occupancy analytics
  # ----------------------------------------------------------------------------
  streaming_service:
    build:
      context: .
      args:
        SECRET_KEY: ${SECRET_KEY}
        DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-edumi_core.settings}
    container_name: edumi_streaming_service
    restart: unless-stopped
    command: ["python", "streaming_service/serve.py"]
    env_file: .env
    volumes:
      - ./database/media:/app/database/media
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8008:8008"
    networks:
      - edumi_net

  # ----------------------------------------------------------------------------
  # 6. Celery Background Worker — Asynchronous transcoding & summarization
  # ----------------------------------------------------------------------------
  celery:
    build:
      context: .
      args:
        SECRET_KEY: ${SECRET_KEY}
        DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-edumi_core.settings}
    container_name: edumi_celery
    restart: unless-stopped
    command: ["celery", "-A", "edumi_core", "worker", "-l", "info", "-P", "threads"]
    env_file: .env
    volumes:
      - ./database/media:/app/database/media
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - edumi_net

  # ----------------------------------------------------------------------------
  # 7. Nginx Reverse Proxy — HTTPS termination & static/media file routing
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:stable-alpine
    container_name: edumi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - staticfiles_data:/app/staticfiles:ro
      - ./database/media:/app/database/media:ro
      - ./media:/app/media:ro
    depends_on:
      - web
      - streaming_service
      - livekit
    networks:
      - edumi_net

volumes:
  postgres_data:
  staticfiles_data:

networks:
  edumi_net:
    driver: bridge

<!-- Chat Composer -->
<div class="messages-chat-composer">
  <!-- Attachment previews -->
  <div class="composer-preview-strip" id="attachmentPreviewStrip" style="display:none;"></div>

  <form id="messageForm" action="{% url 'send_message' conversation.id %}" method="post" enctype="multipart/form-data" class="composer-form-layout">
    {% csrf_token %}

    <div class="composer-actions-left">
      <!-- File Attach Button -->
      <label class="composer-icon-btn" title="Attach Document / Media" style="cursor: pointer;">
        <input type="file" name="file" id="fileInput" style="display:none;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m18.375 12.739-7.693 7.693a4.5 4.5 0 0 1-6.364-6.364l10.94-10.94A3 3 0 1 1 19.5 7.372L8.552 18.32m.009-.01-.01.01m5.699-9.941-7.81 7.81a1.5 1.5 0 0 0 2.112 2.13"/></svg>
      </label>

      <!-- Image Attach (Hidden input) -->
      <input type="file" name="image" id="imageInput" accept="image/*" style="display:none;" aria-label="Upload image">

      <!-- Emoji Picker button wrapper -->
      <div style="position:relative;" id="emojiWrap">
        <button type="button" class="composer-icon-btn" id="emojiToggleBtn" onclick="toggleEmojiPicker()" title="Emoji" aria-label="Toggle emoji picker">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.182 15.182a4.5 4.5 0 0 1-6.364 0M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM9.75 9.75c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75Zm-.375 0h.008v.015h-.008V9.75Zm5.625 0c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75Zm-.375 0h.008v.015h-.008V9.75Z"/></svg>
        </button>
        
        <!-- Emoji Picker Panel -->
        <div class="composer-emoji-picker" id="emojiPicker" style="bottom: 50px; left: 0; right: auto;">
          <div class="emoji-picker-search-bar">
            <input type="text" id="emojiSearch" name="emoji_search" placeholder="Search emoji…" autocomplete="off" aria-label="Search emojis" oninput="filterEmojis(this.value)">
          </div>
          <div class="emoji-picker-grid" id="emojiGrid"></div>
        </div>
      </div>
    </div>

    <div class="composer-input-row" id="chatInputRow">
      <textarea name="content" id="msgInput"
                class="composer-textarea" rows="1"
                placeholder="Type a message" aria-label="Type a message"></textarea>
    </div>

    <div class="composer-actions-right" style="padding-bottom: 5px;">
      <button type="submit" class="composer-send-btn" id="sendBtn" title="Send" disabled style="background:transparent; color:var(--msg-text-muted); box-shadow:none; width: 32px; height: 32px;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>
  </form>
</div>

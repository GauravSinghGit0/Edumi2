<!-- Quick Tips for Best Results -->
<div class="tips-grid">
    <div class="tip-card">
        <div class="tip-icon">
            <i data-lucide="sun" style="width:18px; height:18px;"></i>
        </div>
        <div class="tip-body">
            <h6>Good Lighting</h6>
            <p>Face toward the light and avoid bright windows or shadows behind you.</p>
        </div>
    </div>
    <div class="tip-card">
        <div class="tip-icon">
            <i data-lucide="user" style="width:18px; height:18px;"></i>
        </div>
        <div class="tip-body">
            <h6>Face Forward</h6>
            <p>Keep your head level and look directly at your screen's camera.</p>
        </div>
    </div>
    <div class="tip-card">
        <div class="tip-icon">
            <i data-lucide="glasses" style="width:18px; height:18px;"></i>
        </div>
        <div class="tip-body">
            <h6>Uncovered Face</h6>
            <p>Remove heavy hats, face masks, or sunglasses before scanning.</p>
        </div>
    </div>
</div>

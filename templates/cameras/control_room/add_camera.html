<!-- ================= CAMERA MODAL ================= -->
<div id="cameraModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Add Camera</h2>
            <button class="modal-close-btn" onclick="closeModal()" title="Close">✕</button>
        </div>

        <form id="cameraForm" onsubmit="saveCamera(event)">
            {% csrf_token %}
            <input type="hidden" id="cameraId" name="camera_id">

            <div class="form-group">
                <label>Camera Name</label>
                <input type="text" id="camName" name="name" class="form-control" required placeholder="e.g. Classroom Front Camera">
            </div>

            <div class="form-group">
                <label>Camera Type</label>
                <select id="camType" name="camera_type" class="form-control" onchange="handleTypeChange()">
                    <option value="rtsp">RTSP IP Camera</option>
                    <option value="ip_webcam">IP Webcam (Android app)</option>
                    <option value="droidcam">DroidCam (iPhone / Android)</option>
                </select>
            </div>

            <!-- Type-specific hint banner -->
            <div id="typeHint" style="
                background: var(--color-primary-bg, rgba(99, 102, 241, 0.08));
                border: 1px solid var(--color-border, #e2e8f0);
                border-radius: var(--radius-md, 0.5rem);
                padding: 0.75rem 1rem;
                font-size: 0.8125rem;
                color: var(--color-text-main, #0f172a);
                margin-bottom: 1rem;
                line-height: 1.5;
            "></div>

            <div class="grid-2">
                <div class="form-group">
                    <label>IP Address</label>
                    <input type="text" id="camIp" name="ip_address" class="form-control" required placeholder="192.168.1.x">
                </div>

                <div class="form-group">
                    <label id="portLabel">Port</label>
                    <input type="number" id="camPort" name="port" class="form-control" value="554">
                </div>
            </div>

            <div id="rtspAuth" class="grid-2">
                <div class="form-group">
                    <label>Username <span style="color:var(--color-text-muted, #94a3b8); font-weight:400;">(optional)</span></label>
                    <input type="text" id="camUser" name="username" class="form-control" placeholder="Leave blank if none">
                </div>
                <div class="form-group">
                    <label>Password <span style="color:var(--color-text-muted, #94a3b8); font-weight:400;">(optional)</span></label>
                    <input type="password" id="camPass" name="password" class="form-control" placeholder="Leave blank if none">
                </div>
            </div>

            <div id="rtspPath" class="form-group">
                <label>Stream Path <span style="color:var(--color-text-muted, #94a3b8); font-weight:400;">(optional — auto-detected if empty)</span></label>
                <input type="text" id="camStreamPath" name="stream_path" class="form-control" placeholder="/stream  or  /live  or  /axis-media/media.amp">
            </div>

            <!-- Test result area -->
            <div id="testResult" style="display:none; margin-bottom:1rem; padding:0.75rem 1rem; border-radius:var(--radius-md, 0.5rem); font-size:0.8125rem;"></div>

            <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
                <button type="button" id="testBtn" onclick="testCameraConnection()" style="
                    flex:1; min-width:120px;
                    padding:0.75rem;
                    background:var(--color-bg-hover, #f1f5f9);
                    color:var(--color-text-main, #0f172a);
                    border:1px solid var(--color-border, #e2e8f0);
                    border-radius:var(--radius-md, 0.5rem);
                    font-weight:600;
                    cursor:pointer;
                    display:flex; align-items:center; justify-content:center; gap:0.5rem;
                    transition: all 0.2s ease;
                ">
                    🔍 Test Connection
                </button>
                <button type="submit" class="btn-save" style="flex:2; min-width:160px;">Save Camera</button>
            </div>
        </form>
    </div>
</div>

<style>
    .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }
    @media (max-width: 480px) {
        .grid-2 { grid-template-columns: 1fr; }
    }
</style>

<script>
(function() {
    'use strict';

    var TYPE_META = {
        rtsp: {
            ip: '192.168.1.100',
            port: 554,
            username: '',
            password: '',
            stream_path: '/h264',
            hint: `<b>RTSP Camera</b> — e.g. Hikvision, Dahua, Reolink, etc.<br>
                   • Default port: <b>554</b><br>
                   • Leave stream path blank to auto-detect, or enter manually (e.g. <code>/stream</code>, <code>/h264</code>)<br>
                   • Username / password: only if your camera requires login`,
        },
        ip_webcam: {
            ip: '192.168.1.100',
            port: 8080,
            username: '',
            password: '',
            stream_path: '/video',
            hint: `<b>IP Webcam (Android)</b> — install the "IP Webcam" app by Pavel Khlebovich<br>
                   • Open the app → tap <b>Start server</b> — note the URL shown (e.g. <code>http://192.168.1.5:8080</code>)<br>
                   • Default port: <b>8080</b> — enter the IP shown in the app<br>
                   • Make sure your phone and this PC are on the <b>same WiFi network</b>`,
        },
        droidcam: {
            ip: '192.168.1.100',
            port: 4747,
            username: '',
            password: '',
            stream_path: '/mjpegfeed',
            hint: `<b>DroidCam</b> — install DroidCam on your iPhone or Android<br>
                   • Open the app → note the <b>WiFi IP</b> shown on screen<br>
                   • Default port: <b>4747</b><br>
                   • Make sure your phone and this PC are on the <b>same WiFi network</b><br>
                   • For iPhone: use DroidCam from the App Store`,
        },
    };

    window.TYPE_META = TYPE_META;

    function handleTypeChange() {
        var camTypeEl = document.getElementById('camType');
        if (!camTypeEl) return;
        var type = camTypeEl.value;
        var meta = TYPE_META[type];
        if (!meta) return;

        var camIdEl = document.getElementById('cameraId');
        var isNew = !camIdEl || !camIdEl.value;

        if (isNew) {
            var ipEl = document.getElementById('camIp');
            var userEl = document.getElementById('camUser');
            var passEl = document.getElementById('camPass');
            var pathEl = document.getElementById('camStreamPath');
            if (ipEl) ipEl.value = meta.ip;
            if (userEl) userEl.value = meta.username;
            if (passEl) passEl.value = meta.password;
            if (pathEl) pathEl.value = meta.stream_path;
        }

        var portEl = document.getElementById('camPort');
        if (portEl) portEl.value = meta.port;

        var hintEl = document.getElementById('typeHint');
        if (hintEl) hintEl.innerHTML = meta.hint;

        var rtspAuth = document.getElementById('rtspAuth');
        if (rtspAuth) rtspAuth.style.display = 'grid';

        var rtspPath = document.getElementById('rtspPath');
        if (rtspPath) rtspPath.style.display = 'block';

        var testResult = document.getElementById('testResult');
        if (testResult) testResult.style.display = 'none';
    }

    function openAddModal() {
        var form = document.getElementById('cameraForm');
        if (form) form.reset();
        var idEl = document.getElementById('cameraId');
        if (idEl) idEl.value = '';
        var titleEl = document.getElementById('modalTitle');
        if (titleEl) titleEl.innerText = 'Add Camera';
        var testResult = document.getElementById('testResult');
        if (testResult) testResult.style.display = 'none';

        handleTypeChange();
        var modal = document.getElementById('cameraModal');
        if (modal) modal.classList.add('show');
        if (typeof window.disableScroll === 'function') window.disableScroll();
    }

    function closeModal() {
        var modal = document.getElementById('cameraModal');
        if (modal) modal.classList.remove('show');
        if (typeof window.enableScroll === 'function') window.enableScroll();
    }

    async function openEditModal(id) {
        try {
            var res = await fetch(`/cameras/edit-camera/${id}/`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            var data = await res.json();

            var titleEl = document.getElementById('modalTitle');
            if (titleEl) titleEl.innerText = 'Edit Camera';
            var idEl = document.getElementById('cameraId');
            if (idEl) idEl.value = data.id;
            var nameEl = document.getElementById('camName');
            if (nameEl) nameEl.value = data.name;
            var typeEl = document.getElementById('camType');
            if (typeEl) typeEl.value = data.camera_type;
            var ipEl = document.getElementById('camIp');
            if (ipEl) ipEl.value = data.ip_address;
            var portEl = document.getElementById('camPort');
            if (portEl) portEl.value = data.port;
            var userEl = document.getElementById('camUser');
            if (userEl) userEl.value = data.username || '';
            var passEl = document.getElementById('camPass');
            if (passEl) passEl.value = data.password || '';
            var pathEl = document.getElementById('camStreamPath');
            if (pathEl) pathEl.value = data.stream_path || '';
            var testResult = document.getElementById('testResult');
            if (testResult) testResult.style.display = 'none';

            handleTypeChange();
            var modal = document.getElementById('cameraModal');
            if (modal) modal.classList.add('show');
            if (typeof window.disableScroll === 'function') window.disableScroll();
        } catch (e) {
            alert('Failed to load camera data: ' + e.message);
        }
    }

    async function testCameraConnection() {
        var ipEl = document.getElementById('camIp');
        var portEl = document.getElementById('camPort');
        var typeEl = document.getElementById('camType');
        var idEl = document.getElementById('cameraId');

        var ip = ipEl ? ipEl.value.trim() : '';
        var port = portEl ? portEl.value.trim() : '';
        var type = typeEl ? typeEl.value : 'rtsp';
        var id = idEl ? idEl.value : '';

        if (!ip) {
            showTestResult('error', 'Enter an IP address first.');
            return;
        }

        var btn = document.getElementById('testBtn');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '⏳ Testing...';
        }
        showTestResult('info', 'Probing camera — this may take a few seconds...');

        if (id) {
            try {
                var res = await fetch(`/cameras/test-camera/${id}/`);
                var data = await res.json();
                renderTestResult(data);
            } catch(e) {
                showTestResult('error', `Network error: ${e.message}`);
            }
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '🔍 Test Connection';
            }
            return;
        }

        try {
            var probeUrl = `/cameras/probe/?type=${encodeURIComponent(type)}&ip=${encodeURIComponent(ip)}&port=${encodeURIComponent(port)}`;
            var res = await fetch(probeUrl);
            var data = await res.json();
            renderTestResult(data);
        } catch(e) {
            showTestResult('error', `Could not reach server: ${e.message}`);
        }

        if (btn) {
            btn.disabled = false;
            btn.innerHTML = '🔍 Test Connection';
        }
    }

    function renderTestResult(data) {
        if (!data) return;
        if (data.overall_status === 'success') {
            var path = data.working_path || '';
            showTestResult('success',
                `✅ <b>Camera reachable!</b>  Working path: <code>${path}</code><br>${data.hint || ''}`
            );
            var streamPathEl = document.getElementById('camStreamPath');
            var rtspPathEl = document.getElementById('rtspPath');
            if (path && streamPathEl && rtspPathEl && rtspPathEl.style.display !== 'none') {
                streamPathEl.value = path;
            }
        } else {
            var results = (data.results || []).map(function(r) {
                return `<code>${r.url || r.method}</code> → ${r.status}`;
            }).join('<br>');
            showTestResult('error',
                `❌ <b>Camera not reachable</b><br>${data.hint || ''}<br><br>${results}`
            );
        }
    }

    function showTestResult(type, html) {
        var el = document.getElementById('testResult');
        if (!el) return;
        var styles = {
            success: 'background:#f0fdf4; border:1px solid #bbf7d0; color:#166534;',
            error:   'background:#fef2f2; border:1px solid #fecaca; color:#991b1b;',
            info:    'background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af;',
        };
        el.style.cssText = `display:block; padding:0.75rem 1rem; border-radius:0.5rem; font-size:0.8rem; line-height:1.6; ${styles[type] || styles.info}`;
        el.innerHTML = html;
    }

    async function saveCamera(e) {
        if (e) e.preventDefault();
        var form = document.getElementById('cameraForm');
        if (!form) return;
        var formData = new FormData(form);
        var id = formData.get('camera_id');
        var url = id ? `/cameras/edit-camera/${id}/` : `/cameras/add-camera/`;

        var csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '{{ csrf_token }}';

        try {
            var res = await fetch(url, {
                method: 'POST',
                body: formData,
                headers: { 'X-CSRFToken': csrfToken }
            });

            if (res.redirected) {
                window.location.href = res.url;
                return;
            }

            var data = await res.json();
            if (data.status === 'success') {
                if (typeof Turbo !== 'undefined') {
                    Turbo.visit(window.location.href, { action: 'replace' });
                } else {
                    window.location.reload();
                }
            } else {
                alert(data.message || 'Failed to save camera');
            }
        } catch (err) {
            alert('Error submitting camera form: ' + err.message);
        }
    }

    // Expose all modal and action handlers to window
    window.handleTypeChange = handleTypeChange;
    window.openAddModal = openAddModal;
    window.closeModal = closeModal;
    window.openEditModal = openEditModal;
    window.testCameraConnection = testCameraConnection;
    window.saveCamera = saveCamera;

    // Run handleTypeChange on load and Turbo navigations
    document.addEventListener('DOMContentLoaded', handleTypeChange);
    document.addEventListener('turbo:load', handleTypeChange);
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edumi - Educational Management System</title>
    {% load static %}
    <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% include 'components/lucide_icons.html' %}
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
        }
        body {
            background-color: var(--bg);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .mic-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .mic-button {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: #1e293b;
            border: 8px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .mic-button.active {
            background: var(--primary);
            border-color: #818cf8;
            box-shadow: 0 0 50px rgba(99, 102, 241, 0.4);
            transform: scale(1.05);
        }
        .mic-button i {
            width: 80px;
            height: 80px;
            color: #94a3b8;
        }
        .mic-button.active i {
            color: white;
        }
        .pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0;
            z-index: -1;
        }
        .mic-button.active .pulse {
            animation: pulse-ring 1.5s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.8); opacity: 0; }
        }
        .status-badge {
            margin-top: 2rem;
            padding: 0.5rem 1.5rem;
            border-radius: 2rem;
            background: #1e293b;
            font-weight: 700;
            font-size: 0.875rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .status-badge.connected {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }
        .level-meter {
            width: 240px;
            height: 8px;
            background: #1e293b;
            border-radius: 4px;
            margin-top: 3rem;
            overflow: hidden;
            position: relative;
        }
        .level-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #34d399);
            transition: width 0.1s ease-out;
        }
        .settings-card {
            background: #1e293b;
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin: 1rem;
            border: 1px solid #334155;
        }
        .form-select {
            background-color: #0f172a;
            border-color: #334155;
            color: white;
            border-radius: 0.75rem;
            padding: 0.75rem;
        }
        .form-select:focus {
            background-color: #0f172a;
            color: white;
            border-color: var(--primary);
            box-shadow: none;
        }
        .header {
            padding: 1.5rem;
            text-align: center;
            border-bottom: 1px solid #1e293b;
            position: relative;
        }
        .logout-btn {
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: #ef4444;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .header h1 {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 0;
        }
    </style>
</head>
<body data-turbo="false">
    <div class="header">
        <h1>Edumi Remote Mic</h1>
        <div style="font-size: 0.75rem; color: #64748b;">{{ camera.name }}</div>
        <a href="{% url 'logout' %}" class="logout-btn">
            <i data-lucide="log-out" style="width: 18px; height: 18px;"></i>
            <span>Logout</span>
        </a>
    </div>

    <div class="mic-container">
        <button id="micBtn" class="mic-button" onclick="toggleMic()">
            <div class="pulse"></div>
            <i data-lucide="mic"></i>
        </button>
        <div id="statusBadge" class="status-badge">Tap to Enable Mic</div>
        
        <div class="level-meter">
            <div id="levelBar" class="level-bar"></div>
        </div>
    </div>

    <div class="settings-card">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="form-label small text-muted text-uppercase fw-bold mb-0">Input Source</label>
            <button class="btn btn-link btn-sm p-0 text-decoration-none" onclick="getDevices()" style="color: var(--primary); font-size: 0.75rem;">
                <i data-lucide="refresh-cw" style="width: 12px; height: 12px; vertical-align: middle;"></i> Refresh
            </button>
        </div>
        <select id="deviceSelect" name="audio_device" class="form-select mb-3" aria-label="Select audio input device">
            <option value="">Detecting Devices...</option>
        </select>
        
        <div class="d-flex justify-content-between align-items-center">
            <label for="autoSyncSwitch" class="small text-muted mb-0">Auto Sync Enabled</label>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="autoSyncSwitch" name="auto_sync" checked disabled aria-label="Auto sync enabled">
            </div>
        </div>
    </div>

    <script>
        let isStreaming = false;
        let audioStream = null;
        let audioContext = null;
        let audioSocket = null;
        let analyzer = null;
        let dataArray = null;
        let animationFrame = null;
        let wakeLock = null;

        const micBtn = document.getElementById('micBtn');
        const statusBadge = document.getElementById('statusBadge');
        const deviceSelect = document.getElementById('deviceSelect');
        const levelBar = document.getElementById('levelBar');

        // Initialize Lucide Icons
        lucide.createIcons();

        // Enumerate Devices
        async function getDevices() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(d => d.kind === 'audioinput');
                deviceSelect.innerHTML = '';
                audioInputs.forEach(device => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Microphone ${deviceSelect.length + 1}`;
                    deviceSelect.appendChild(option);
                });
            } catch (err) {
                console.error('Error getting devices:', err);
            }
        }

        // Request initial permission and get devices
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(s => {
                s.getTracks().forEach(t => t.stop());
                getDevices();
            })
            .catch(console.error);

        async function toggleMic() {
            if (isStreaming) {
                stopStreaming();
            } else {
                startStreaming();
            }
        }

        async function startStreaming() {
            try {
                const deviceId = deviceSelect.value;
                audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        deviceId: deviceId ? { exact: deviceId } : undefined,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                // Request Wake Lock to keep Safari alive in background
                if ('wakeLock' in navigator) {
                    try {
                        wakeLock = await navigator.wakeLock.request('screen');
                    } catch (err) {}
                }

                // Setup Audio Context for visualization
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(audioStream);
                analyzer = audioContext.createAnalyser();
                analyzer.fftSize = 256;
                source.connect(analyzer);
                dataArray = new Uint8Array(analyzer.frequencyBinCount);

                // Setup WebSocket
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws/audio/{{ camera.id }}/?source=mobile`;
                audioSocket = new WebSocket(wsUrl);
                audioSocket.binaryType = 'arraybuffer';

                audioSocket.onopen = () => {
                    isStreaming = true;
                    micBtn.classList.add('active');
                    statusBadge.innerText = 'Live Streaming';
                    statusBadge.classList.add('connected');
                    startEncoding();
                    updateLevel();
                };

                audioSocket.onclose = () => stopStreaming();
                audioSocket.onerror = (err) => console.error('WS Error:', err);

            } catch (err) {
                console.error('Start Error:', err);
                alert('Could not access microphone. Please check permissions.');
            }
        }

        function startEncoding() {
            const mediaRecorder = new MediaRecorder(audioStream, {
                mimeType: 'audio/webm;codecs=opus'
            });

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0 && audioSocket && audioSocket.readyState === WebSocket.OPEN) {
                    audioSocket.send(e.data);
                }
            };

            mediaRecorder.start(100); // Send 100ms chunks for ultra low latency
            window.recorder = mediaRecorder;
        }

        function updateLevel() {
            if (!isStreaming) return;
            analyzer.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            const average = sum / dataArray.length;
            levelBar.style.width = Math.min(100, average * 1.5) + '%';
            animationFrame = requestAnimationFrame(updateLevel);
        }

        function stopStreaming() {
            isStreaming = false;
            micBtn.classList.remove('active');
            statusBadge.innerText = 'Tap to Enable Mic';
            statusBadge.classList.remove('connected');
            levelBar.style.width = '0%';

            if (window.recorder) window.recorder.stop();
            if (audioStream) audioStream.getTracks().forEach(t => t.stop());
            if (audioSocket) audioSocket.close();
            if (audioContext) audioContext.close();
            if (animationFrame) cancelAnimationFrame(animationFrame);
            if (wakeLock) wakeLock.release().then(() => wakeLock = null);
        }

        // Handle Safari background/visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isStreaming) {
                // Re-request wake lock if we're still streaming
                if ('wakeLock' in navigator && !wakeLock) {
                    navigator.wakeLock.request('screen').then(w => wakeLock = w);
                }
            }
        });
    </script>
    {% include 'components/reusable_popup.html' %}
</body>
</html>

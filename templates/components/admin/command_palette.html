<!-- Command Palette Modal (Ctrl+K) -->
<div id="commandPaletteOverlay" class="cmd-palette-overlay" role="dialog" aria-modal="true" aria-label="Command Palette" style="display: none;">
    <div class="cmd-palette-backdrop" onclick="closeCommandPalette()"></div>
    <div class="cmd-palette-modal">
        <!-- Search Input Bar -->
        <div class="cmd-palette-header">
            <i data-lucide="search" class="cmd-palette-search-icon"></i>
            <input type="text" id="cmdPaletteInput" class="cmd-palette-input" 
                   placeholder="Search users, courses, live sessions, or actions... (Esc to close)" 
                   autocomplete="off" spellcheck="false" 
                   role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="cmdPaletteResults">
            <div class="cmd-palette-shortcuts">
                <kbd class="cmd-kbd">ESC</kbd>
            </div>
        </div>

        <!-- Quick Filter Category Tabs -->
        <div class="cmd-palette-filters">
            <button type="button" class="cmd-filter-pill active" data-filter="all" onclick="filterCmdPalette('all', this)">All</button>
            <button type="button" class="cmd-filter-pill" data-filter="Quick Actions" onclick="filterCmdPalette('Quick Actions', this)">Actions</button>
            <button type="button" class="cmd-filter-pill" data-filter="Users" onclick="filterCmdPalette('Users', this)">Users</button>
            <button type="button" class="cmd-filter-pill" data-filter="Courses" onclick="filterCmdPalette('Courses', this)">Courses</button>
            <button type="button" class="cmd-filter-pill" data-filter="Live Sessions" onclick="filterCmdPalette('Live Sessions', this)">Sessions</button>
        </div>

        <!-- Results Body -->
        <div class="cmd-palette-body" id="cmdPaletteResults" role="listbox">
            <div class="cmd-palette-loading" id="cmdPaletteLoading" style="display: none;">
                <div class="cmd-spinner"></div>
                <span>Searching workspace...</span>
            </div>
            <div class="cmd-palette-list" id="cmdPaletteList">
                <!-- Dynamically rendered via JS -->
            </div>
            <div class="cmd-palette-empty" id="cmdPaletteEmpty" style="display: none;">
                <i data-lucide="help-circle" style="width: 32px; height: 32px; opacity: 0.5; margin-bottom: 0.5rem;"></i>
                <div style="font-weight: 600;">No matching results found</div>
                <div style="font-size: 0.8rem; color: var(--color-text-muted); margin-top: 0.25rem;">Try searching for a user name, course title, or action like "import"</div>
            </div>
        </div>

        <!-- Footer with Navigation Hints -->
        <div class="cmd-palette-footer">
            <div class="cmd-footer-hint">
                <kbd class="cmd-kbd-sm">&uarr;</kbd><kbd class="cmd-kbd-sm">&darr;</kbd> <span>Navigate</span>
            </div>
            <div class="cmd-footer-hint">
                <kbd class="cmd-kbd-sm">&crarr;</kbd> <span>Open</span>
            </div>
            <div class="cmd-footer-hint">
                <kbd class="cmd-kbd-sm">Esc</kbd> <span>Close</span>
            </div>
            <div class="cmd-footer-brand">
                <span>EduMi Command</span>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    let currentResults = [];
    let selectedIndex = 0;
    let activeFilter = 'all';
    let debounceTimer = null;

    window.openCommandPalette = function() {
        const overlay = document.getElementById('commandPaletteOverlay');
        const input = document.getElementById('cmdPaletteInput');
        if (!overlay || !input) return;

        overlay.style.display = 'flex';
        // force reflow
        void overlay.offsetWidth;
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
        input.value = '';
        input.focus();
        fetchCommandPaletteResults('');
    };

    window.closeCommandPalette = function() {
        const overlay = document.getElementById('commandPaletteOverlay');
        if (!overlay) return;

        overlay.classList.remove('active');
        setTimeout(() => {
            overlay.style.display = 'none';
            document.body.style.overflow = '';
        }, 180);
    };

    window.toggleCommandPalette = function() {
        const overlay = document.getElementById('commandPaletteOverlay');
        if (overlay && overlay.classList.contains('active')) {
            closeCommandPalette();
        } else {
            openCommandPalette();
        }
    };

    window.filterCmdPalette = function(category, btn) {
        activeFilter = category;
        document.querySelectorAll('.cmd-filter-pill').forEach(p => p.classList.remove('active'));
        if (btn) btn.classList.add('active');
        renderItems();
    };

    function fetchCommandPaletteResults(query) {
        const loading = document.getElementById('cmdPaletteLoading');
        const empty = document.getElementById('cmdPaletteEmpty');
        const list = document.getElementById('cmdPaletteList');
        
        if (loading) loading.style.display = 'flex';
        if (empty) empty.style.display = 'none';

        fetch(`/admin/api/command-palette/?q=${encodeURIComponent(query)}`, {
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(res => res.json())
        .then(data => {
            if (loading) loading.style.display = 'none';
            if (data.status === 'success') {
                currentResults = data.results || [];
                renderItems();
            }
        })
        .catch(err => {
            if (loading) loading.style.display = 'none';
            console.error('Command palette fetch error:', err);
        });
    }

    function renderItems() {
        const list = document.getElementById('cmdPaletteList');
        const empty = document.getElementById('cmdPaletteEmpty');
        if (!list) return;

        const filtered = activeFilter === 'all' 
            ? currentResults 
            : currentResults.filter(item => item.category === activeFilter);

        list.innerHTML = '';
        selectedIndex = 0;

        if (filtered.length === 0) {
            if (empty) empty.style.display = 'flex';
            return;
        }
        if (empty) empty.style.display = 'none';

        // Group by category
        const groups = {};
        filtered.forEach(item => {
            if (!groups[item.category]) groups[item.category] = [];
            groups[item.category].push(item);
        });

        let flatIndex = 0;
        for (const [catName, items] of Object.entries(groups)) {
            const catHeader = document.createElement('div');
            catHeader.className = 'cmd-category-title';
            catHeader.textContent = catName;
            list.appendChild(catHeader);

            items.forEach(item => {
                const el = document.createElement('a');
                el.href = item.url;
                el.className = 'cmd-item' + (flatIndex === 0 ? ' selected' : '');
                el.setAttribute('data-index', flatIndex);
                el.setAttribute('role', 'option');
                el.id = `cmd-item-${flatIndex}`;

                el.innerHTML = `
                    <div class="cmd-item-icon-box">
                        <i data-lucide="${item.icon || 'arrow-right'}"></i>
                    </div>
                    <div class="cmd-item-content">
                        <div class="cmd-item-title">${escapeHtml(item.title)}</div>
                        <div class="cmd-item-subtitle">${escapeHtml(item.subtitle)}</div>
                    </div>
                    <span class="cmd-item-badge">${escapeHtml(item.badge || item.category)}</span>
                `;

                el.addEventListener('mouseenter', function() {
                    setSelectedIndex(parseInt(this.getAttribute('data-index'), 10));
                });

                el.addEventListener('click', function(e) {
                    closeCommandPalette();
                });

                list.appendChild(el);
                flatIndex++;
            });
        }

        if (window.lucide && lucide.createIcons) {
            lucide.createIcons();
        }
    }

    function setSelectedIndex(index) {
        const items = document.querySelectorAll('.cmd-item');
        if (!items.length) return;

        if (index < 0) index = items.length - 1;
        if (index >= items.length) index = 0;

        items.forEach(el => el.classList.remove('selected'));
        selectedIndex = index;

        const current = items[selectedIndex];
        if (current) {
            current.classList.add('selected');
            current.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // Keyboard Shortcuts (Ctrl+K or Cmd+K)
    document.addEventListener('keydown', function(e) {
        // Ctrl+K or Cmd+K
        if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
            e.preventDefault();
            toggleCommandPalette();
            return;
        }

        const overlay = document.getElementById('commandPaletteOverlay');
        if (!overlay || !overlay.classList.contains('active')) return;

        if (e.key === 'Escape') {
            e.preventDefault();
            closeCommandPalette();
            return;
        }

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            setSelectedIndex(selectedIndex + 1);
            return;
        }

        if (e.key === 'ArrowUp') {
            e.preventDefault();
            setSelectedIndex(selectedIndex - 1);
            return;
        }

        if (e.key === 'Enter') {
            const items = document.querySelectorAll('.cmd-item');
            if (items[selectedIndex]) {
                e.preventDefault();
                items[selectedIndex].click();
                window.location.href = items[selectedIndex].href;
            }
            return;
        }
    });

    // Input Search Debounce
    document.addEventListener('DOMContentLoaded', function() {
        const input = document.getElementById('cmdPaletteInput');
        if (input) {
            input.addEventListener('input', function() {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    fetchCommandPaletteResults(input.value.trim());
                }, 160);
            });
        }
    });
})();
</script>

{% comment %}
Global Loading Overlay Component
Automatically shows when async operations are in progress
{% endcomment %}

<div id="globalLoadingOverlay" class="loading-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:9999;justify-content:center;align-items:center;">
    <div class="loading-spinner-container" style="background:var(--color-bg-card);padding:2rem 3rem;border-radius:1rem;box-shadow:0 10px 40px rgba(0,0,0,0.3);text-align:center;">
        <div class="spinner" style="width:48px;height:48px;border:4px solid var(--color-border);border-top-color:var(--color-primary);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem;"></div>
        <div id="loadingMessage" style="font-size:0.95rem;font-weight:600;color:var(--color-text-main);">Processing...</div>
        <div style="font-size:0.8rem;color:var(--color-text-muted);margin-top:0.5rem;">Please wait</div>
    </div>
</div>

<style>
@keyframes spin {
    to { transform: rotate(360deg); }
}

.loading-overlay {
    transition: opacity 0.2s ease;
}

.loading-overlay.active {
    display: flex !important;
}

/* Inline loader for buttons */
.btn-loading {
    position: relative;
    pointer-events: none;
    opacity: 0.6;
}

.btn-loading::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    top: 50%;
    left: 50%;
    margin-left: -8px;
    margin-top: -8px;
    border: 2px solid transparent;
    border-top-color: currentColor;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
}
</style>

<script>
// Global loading overlay functions
window.showLoadingOverlay = function(message = 'Processing...') {
    const overlay = document.getElementById('globalLoadingOverlay');
    const messageEl = document.getElementById('loadingMessage');
    if (messageEl) messageEl.textContent = message;
    if (overlay) overlay.classList.add('active');
};

window.hideLoadingOverlay = function() {
    const overlay = document.getElementById('globalLoadingOverlay');
    if (overlay) overlay.classList.remove('active');
};

// Button loading state
window.setButtonLoading = function(button, loading = true) {
    if (loading) {
        button.classList.add('btn-loading');
        button.disabled = true;
        button.dataset.originalText = button.innerHTML;
    } else {
        button.classList.remove('btn-loading');
        button.disabled = false;
        if (button.dataset.originalText) {
            button.innerHTML = button.dataset.originalText;
        }
    }
};

// Auto-show loading on form submissions
document.addEventListener('DOMContentLoaded', function() {
    // Show loading for forms with data-loading attribute
    document.querySelectorAll('form[data-loading]').forEach(form => {
        form.addEventListener('submit', function(e) {
            const message = form.dataset.loadingMessage || 'Submitting...';
            showLoadingOverlay(message);
        });
    });

    // Show loading for links with data-loading attribute
    document.querySelectorAll('a[data-loading]').forEach(link => {
        link.addEventListener('click', function(e) {
            const message = link.dataset.loadingMessage || 'Loading...';
            showLoadingOverlay(message);
        });
    });

    // Show loading for buttons with data-loading attribute
    document.querySelectorAll('button[data-loading]').forEach(button => {
        button.addEventListener('click', function(e) {
            if (button.type !== 'submit') {
                const message = button.dataset.loadingMessage || 'Processing...';
                showLoadingOverlay(message);
            }
        });
    });
});
</script>

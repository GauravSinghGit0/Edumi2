<script src="https://unpkg.com/lucide@0.412.0"></script>
<script>
    // Robust Lucide initialization
    function initIcons() {
        try {
            lucide.createIcons();
        } catch (e) {
            console.error("Lucide error:", e);
            // Fallback for common missing icons
            const missingIcons = document.querySelectorAll('i[data-lucide="linkedin"]');
            missingIcons.forEach(icon => {
                icon.setAttribute('data-lucide', 'external-link');
            });
            lucide.createIcons();
        }
    }
    
    initIcons();
    document.addEventListener('turbo:load', () => {
        initIcons();
    });
</script>

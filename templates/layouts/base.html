<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Edumi - Educational Management System</title>
    {% load static %}
    <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/design-tokens.css' %}?v={{ timestamp }}">
    <link rel="stylesheet" href="{% static 'css/modern-design.css' %}?v={{ timestamp }}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}?v={{ timestamp }}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}?v={{ timestamp }}">
    <!-- Hotwired Turbo for seamless navigation (no full page reloads) -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.5/dist/turbo.es2017-esm.js"></script>
    <script>
        // Enterprise Production Console Guard: silences noisy developer logs for end users
        (function() {
            if (!window.localStorage || localStorage.getItem('edumi_debug') !== 'true') {
                const noop = function() {};
                window.console.log = noop;
                window.console.debug = noop;
                window.console.info = noop;
                window.console.trace = noop;
            }
        })();

        document.addEventListener('turbo:before-fetch-response', (event) => {
            // No action needed yet
        });
        
        document.addEventListener('turbo:frame-missing', (event) => {
            event.preventDefault();
            // Do a full page visit instead of ignoring the response
            event.detail.visit(event.detail.response.url, { action: 'replace' });
        });
    </script>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <script>
        // Apply theme immediately to document root and body to avoid light-mode flash
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark-mode');
                document.body.classList.add('dark-mode');
            }
        })();
    </script>

    {% if messages %}
    <div class="messages-container">
        {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">
            <i data-lucide="{% if message.tags == 'success' %}check-circle{% elif message.tags == 'error' %}alert-circle{% else %}info{% endif %}"></i>
            <span>{{ message }}</span>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    {% block content %}{% endblock %}

    {% include 'partials/welcome_popup.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/eyes.js' %}"></script>
    <script src="{% static 'js/main.js' %}?v={{ timestamp }}"></script>
    <script src="{% static 'js/identity_sync.js' %}"></script>
    {% include 'components/lucide_icons.html' %}
    {% block extra_js %}{% endblock %}
</body>

</html>

        <!-- Top Bar -->
        <div class="meet-topbar">
            <div class="meet-info">
                <h3>{{ meeting.title }}</h3>
                <span class="meet-code">{{ meeting.meeting_code }}</span>
            </div>
            <div class="meet-topbar-right">
                <!-- Unified Quality + Bitrate OLED Control -->
                <div id="unifiedQualityControl" class="unified-quality-control-wrap"></div>

                <div class="recording-indicator" id="recordingIndicator" style="display:none;">
                    <span class="recording-dot"></span>
                    <span class="recording-text">Recording</span>
                    <span class="recording-timer" id="recordingTimer">00:00</span>
                </div>
                <div class="meet-timer-badge" title="Meeting duration">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="12 6 12 12 16 14" />
                    </svg>
                    <span class="meet-timer-label">Duration:</span>
                    <span class="meet-timer" id="meetTimer">00:00</span>
                </div>
            </div>
        </div>
